usage = "arg \"<environment>\" help=\"Target environment\"\nflag \"--target <target>\" help=\"Optional logical target\""
run = 'python3 mise-helper/vendor/pzagent-adw-context/pzagent_context.py e2e adw:test:e2e:full --environment "$usage_environment" ${usage_target:+--target "$usage_target"} --approval-file "${PZ_ADW_APPROVAL_FILE:?}"'

["adw:validate-deployment"]
description = "Run shared status, health and readiness validation without implicit E2E"
dir = "{{config_root}}"
usage = "arg \"<environment>\" help=\"Target environment\"\nflag \"--target <target>\" help=\"Optional logical target\""
run = 'python3 mise-helper/vendor/pzagent-adw-context/pzagent_context.py validate-deployment --environment "$usage_environment" ${usage_target:+--target "$usage_target"} --approval-file "${PZ_ADW_APPROVAL_FILE:?}" --profile-root "${PZ_ADW_PROFILE_ROOT:?}"'

["adw:hotfix:apply"]
description = "Run explicitly authorized temporary hotfix path"
dir = "{{config_root}}"
usage = "arg \"<environment>\" help=\"Non-demo/non-production preview environment\"\nflag \"--target <target>\" help=\"Optional logical target\""
run = 'python3 mise-helper/vendor/pzagent-adw-context/pzagent_context.py hotfix-apply --environment "$usage_environment" ${usage_target:+--target "$usage_target"} --approval-file "${PZ_ADW_APPROVAL_FILE:?}" --profile-root "${PZ_ADW_PROFILE_ROOT:?}" --run-id "${ADW_RUN_ID:?}" --transport "${PZ_ADW_HOTFIX_TRANSPORT:-registry}" ${PZ_ADW_SSH_ALIAS:+--ssh-alias "$PZ_ADW_SSH_ALIAS"}'

["adw:hotfix:restore"]
description = "Restore an approved preview hotfix artifact"
dir = "{{config_root}}"
usage = "arg \"<environment>\" help=\"Non-demo/non-production preview environment\"\nflag \"--target <target>\" help=\"Optional logical target\""
run = 'python3 mise-helper/vendor/pzagent-adw-context/pzagent_context.py hotfix-restore --environment "$usage_environment" ${usage_target:+--target "$usage_target"} --approval-file "${PZ_ADW_APPROVAL_FILE:?}" --profile-root "${PZ_ADW_PROFILE_ROOT:?}" --artifact "${PZ_ADW_RESTORE_ARTIFACT:?}"'
