usage = "arg \"<version-or-ref>\" help=\"Protected version or exact ref\"\narg \"<bundle-sha256>\" help=\"Trusted release bundle descriptor checksum\"\nflag \"--allow-downgrade\" help=\"Permit an older context version\""
run = 'python3 mise-helper/vendor/pzagent-adw-context/pzagent_context.py context-sync --repo-root . --source "$usage_version_or_ref" --bundle-sha256 "$usage_bundle_sha256" ${usage_allow_downgrade:+--allow-downgrade}'

