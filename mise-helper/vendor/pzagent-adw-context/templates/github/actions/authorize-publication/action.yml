name: Authorize immutable publication
description: Prove exact merged PR, protected destination, actor, exact successful workflow run, and diagnostic identity
inputs:
  source_sha: {description: Exact source SHA, required: true}
  ci_run_id: {description: Exact successful CI run ID, required: true}
  ci_run_attempt: {description: Selected successful run attempt, required: true}
  ci_workflow_path: {description: Expected quality workflow path, required: true}
  diagnostic_publish: {description: Explicit diagnostic publication authorization, required: false, default: "false"}
  authorization_path: {description: Closed authorization output path, required: true}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
        CI_RUN_ID: ${{ inputs.ci_run_id }}
        CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
        CI_WORKFLOW_PATH: ${{ inputs.ci_workflow_path }}
        DIAGNOSTIC_PUBLISH: ${{ inputs.diagnostic_publish }}
        AUTHORIZATION_PATH: ${{ inputs.authorization_path }}
        GH_TOKEN: ${{ github.token }}
      run: python3 "$GITHUB_ACTION_PATH/authorize.py"
