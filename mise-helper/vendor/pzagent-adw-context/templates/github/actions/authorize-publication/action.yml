name: Authorize release publication
description: Produce a closed legacy destination or v2.2 PR/destination release receipt from exact quality evidence
inputs:
  source_sha: {description: Exact source SHA, required: true}
  ci_run_id: {description: "Exact successful CI run of the quality workflow for source_sha. For destination scope this is the promotion PR's pull_request run (completed before the merge), never the destination branch's push run", required: true}
  ci_run_attempt: {description: Selected successful run attempt, required: true}
  ci_workflow_path: {description: Expected quality workflow path, required: true}
  release_kind: {description: Release kind for a v2 receipt; omit for legacy immutable publication, required: false, default: ""}
  publication_lane: {description: Stable workflow lane identifier, required: false, default: ""}
  proof_scope: {description: pull_request or destination, required: false, default: "destination"}
  pr_number: {description: "Pull request number: required for pull_request scope; for destination scope the merged promotion PR, verified directly instead of discovered", required: false, default: ""}
  target: {description: Protected target for destination scope, required: false, default: ""}
  publication_pointer: {description: Optional allowlisted mutable pointer, required: false, default: ""}
  expected_pointer_digest: {description: Required CAS expectation when a pointer is selected, required: false, default: ""}
  authorization_path: {description: Closed authorization output path, required: true}
outputs:
  reason:
    description: Fixed refusal reason identifier when the proof was rejected; empty when authorized
    value: ${{ steps.authorize.outputs.reason }}
runs:
  using: composite
  steps:
    - id: authorize
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
        CI_RUN_ID: ${{ inputs.ci_run_id }}
        CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
        CI_WORKFLOW_PATH: ${{ inputs.ci_workflow_path }}
        RELEASE_KIND: ${{ inputs.release_kind }}
        PUBLICATION_LANE: ${{ inputs.publication_lane }}
        PROOF_SCOPE: ${{ inputs.proof_scope }}
        PR_NUMBER: ${{ inputs.pr_number }}
        TARGET: ${{ inputs.target }}
        PUBLICATION_POINTER: ${{ inputs.publication_pointer }}
        EXPECTED_POINTER_DIGEST: ${{ inputs.expected_pointer_digest }}
        AUTHORIZATION_PATH: ${{ inputs.authorization_path }}
        GH_TOKEN: ${{ github.token }}
      run: python3 "$GITHUB_ACTION_PATH/authorize.py"
