name: Publish immutable ADW release
on:
  workflow_call:
    inputs:
      source_sha: {type: string, required: true}
      artifact_name: {type: string, required: true}
      ci_run_id: {type: string, required: true}
      ci_run_attempt: {type: string, required: true}
      ci_workflow_path: {type: string, required: true}
      diagnostic_publish: {type: boolean, required: false, default: false}
permissions:
  contents: read
jobs:
  authorize:
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, actions: read}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./mise-helper/vendor/pzagent-adw-context/templates/github/actions/authorize-publication
        with:
          source_sha: ${{ inputs.source_sha }}
          ci_run_id: ${{ inputs.ci_run_id }}
          ci_run_attempt: ${{ inputs.ci_run_attempt }}
          ci_workflow_path: ${{ inputs.ci_workflow_path }}
          diagnostic_publish: ${{ inputs.diagnostic_publish }}
          authorization_path: authorization.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publication-authorization-${{ inputs.source_sha }}
          path: authorization.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: authorize
    runs-on: ubuntu-latest
    permissions: {contents: read, pull-requests: read, actions: read, packages: write}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        # packages-write must not execute publisher code from a caller-selected
        # source SHA; only the trusted default branch owns this action.
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with: {name: "${{ inputs.artifact_name }}", path: dist}
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with: {name: "publication-authorization-${{ inputs.source_sha }}", path: authorization}
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - uses: ./mise-helper/vendor/pzagent-adw-context/templates/github/actions/publish-immutable-release
        with:
          source_sha: ${{ inputs.source_sha }}
          authorization_path: authorization/authorization.json
          artifact_path: dist
          registry_token: ${{ github.token }}
