schema_version = "1.0.0"

[defaults]
isolated_workspace = "none"

[tasks."adw:install"]
implemented = true
commands = [{argv = ["npm", "ci", "--no-fund"]}, {argv = ["npm", "exec", "--", "playwright", "install", "--only-shell", "chromium"]}]

[tasks."adw:build"]
implemented = true
commands = [{argv = ["npm", "run", "build"]}]
release_commands = [{argv = ["python3", "mise-helper/vendor/pzagent-adw-context/modules/release_build.py", "build"]}]

[tasks."adw:lint"]
implemented = true
commands = [{argv = ["python3", "mise-helper/site_checks.py", "lint"]}]

[tasks."adw:static-analysis"]
implemented = true
commands = [{argv = ["node", "--check", "src/main.js"]}, {argv = ["node", "--check", "mise-helper/browser_e2e.mjs"]}, {argv = ["python3", "mise-helper/site_checks.py", "static-analysis"]}, {argv = ["python3", "mise-helper/vendor/pzagent-adw-context/pzagent_context.py", "secrets-examples", "--check"]}]

[tasks."adw:test:unit"]
implemented = true
commands = [{argv = ["python3", "-m", "unittest", "discover", "-s", "tests", "-q"]}]

[tasks."adw:test:integration:fast"]
implemented = true
commands = [{argv = ["python3", "mise-helper/site_checks.py", "http-smoke"]}]

[tasks."adw:test:integration:full"]
implemented = true
commands = [{argv = ["python3", "mise-helper/site_checks.py", "container-smoke"]}]

[tasks."adw:verify:minimal"]
implemented = true
commands = [{argv = ["mise", "run", "adw:install"]}, {argv = ["mise", "run", "adw:build"]}]
