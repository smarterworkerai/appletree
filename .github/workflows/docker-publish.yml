name: Publish immutable application release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full merged destination SHA to publish
        required: true
        type: string
      ci_run_id:
        description: Exact successful destination CI run ID
        required: true
        type: string
      ci_run_attempt:
        description: Exact successful CI run attempt
        required: true
        type: string

      diagnostic_publish:
        description: Require the exact source to contain deploy_diag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: appletree-release-publication
  cancel-in-progress: false

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  REGISTRY: ghcr.io/smarterworkerai

env:
  # Docker Buildx build records are diagnostic artifacts, not delivery artifacts.
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  authorize:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted publication controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Authorize exact merged destination and quality evidence
        uses: ./mise-helper/vendor/pzagent-adw-context/templates/github/actions/authorize-publication
        with:
          source_sha: ${{ inputs.source_sha }}
          ci_run_id: ${{ inputs.ci_run_id }}
          ci_run_attempt: ${{ inputs.ci_run_attempt }}
          ci_workflow_path: .github/workflows/ci.yml
          diagnostic_publish: ${{ inputs.diagnostic_publish }}
          authorization_path: authorization.json
      - name: Upload closed authorization record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: appletree-publication-authorization-${{ inputs.source_sha }}
          path: authorization.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: authorize
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Check out trusted publication controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: control
          persist-credentials: false
      - name: Download closed authorization record
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: appletree-publication-authorization-${{ inputs.source_sha }}
          path: authorization
      - name: Revalidate publication immediately before package writes
        uses: ./control/mise-helper/vendor/pzagent-adw-context/templates/github/actions/authorize-publication
        with:
          source_sha: ${{ inputs.source_sha }}
          ci_run_id: ${{ inputs.ci_run_id }}
          ci_run_attempt: ${{ inputs.ci_run_attempt }}
          ci_workflow_path: .github/workflows/ci.yml
          diagnostic_publish: ${{ inputs.diagnostic_publish }}
          authorization_path: authorization-recheck.json
      - name: Require identical authorization records
        run: cmp authorization/authorization.json authorization-recheck.json
      - name: Check out exact authorized application source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Require exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ '${{ inputs.source_sha }}' =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C source rev-parse HEAD)" = '${{ inputs.source_sha }}'
      - name: Build exact revision-labelled application image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label 'org.opencontainers.image.revision=${{ inputs.source_sha }}' \
            --label 'org.opencontainers.image.source=https://github.com/${{ github.repository }}' \
            --tag appletree:release source
          test "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' appletree:release)" = '${{ inputs.source_sha }}'
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create or verify immutable image tag
        shell: bash
        run: |
          set -euo pipefail
          short='${{ inputs.source_sha }}'; short="${short:0:12}"
          remote="${REGISTRY}/appletree:sha-$short"
          local_id="$(docker image inspect --format '{{.Id}}' appletree:release)"
          [[ "$local_id" =~ ^sha256:[0-9a-f]{64}$ ]]
          error_file="$(mktemp)"
          if docker pull "$remote" >/dev/null 2>"$error_file"; then
            :
          else
            error="$(<"$error_file")"
            case "$error" in
              *"manifest unknown"*|*"not found"*|*"404"*)
                docker tag appletree:release "$remote"
                docker push "$remote"
                ;;
              *) echo 'immutable image lookup failed closed' >&2; exit 1 ;;
            esac
          fi
          rm -f "$error_file"
          docker pull "$remote" >/dev/null
          remote_id="$(docker image inspect --format '{{.Id}}' "$remote")"
          test "$remote_id" = "$local_id"
          test "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' "$remote")" = '${{ inputs.source_sha }}'
          docker image inspect --format '{{json .RepoDigests}}' "$remote" > repo-digests.json
          python3 - <<'PY'
          import json,re
          values=json.load(open('repo-digests.json',encoding='utf-8'))
          matches=[v for v in values if re.fullmatch(r'ghcr\.io/smarterworkerai/appletree@sha256:[0-9a-f]{64}',v)]
          if len(matches)!=1: raise SystemExit('canonical image digest is ambiguous')
          open('image-digest.txt','w',encoding='utf-8').write(matches[0]+'\n')
          PY
      - name: Build immutable release manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          short='${{ inputs.source_sha }}'; short="${short:0:12}"
          jq -n \
            --arg source '${{ inputs.source_sha }}' \
            --arg tag "sha-$short" \
            --arg image "$(<image-digest.txt)" \
            '{schema:"appletree.application-release/v1",source_sha:$source,source_tag:$tag,images:{application:$image}}' \
            > release/manifest.json
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      - name: Publish or verify create-only immutable release manifest
        shell: bash
        run: |
          set -euo pipefail
          short='${{ inputs.source_sha }}'; short="${short:0:12}"
          immutable="${REGISTRY}/appletree-release:sha-$short"
          existing="$(mktemp -d)"
          error_file="$(mktemp)"
          if oras pull "$immutable" --output "$existing" >/dev/null 2>"$error_file"; then
            cmp release/manifest.json "$existing/manifest.json"
          else
            error="$(<"$error_file")"
            case "$error" in
              *"manifest unknown"*|*"not found"*|*"404"*)
                oras push "$immutable" \
                  --artifact-type application/vnd.smarterworkerai.appletree.application-release.v1+json \
                  --annotation 'org.opencontainers.image.revision=${{ inputs.source_sha }}' \
                  release/manifest.json:application/json
                ;;
              *) echo 'immutable release lookup failed closed' >&2; exit 1 ;;
            esac
          fi
          rm -f "$error_file"
          descriptor="$(oras manifest fetch --descriptor "$immutable")"
          jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$descriptor" >/dev/null
          readback="$(mktemp -d)"
          oras pull "$immutable" --output "$readback" >/dev/null
          cmp release/manifest.json "$readback/manifest.json"
          echo 'Immutable release published; deploy-owned pointers remain unchanged.'
