server {
  listen 3333;
  listen [::]:3333;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location = /.well-known/adw-release.json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
